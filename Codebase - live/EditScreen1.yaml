Screens:
  EditScreen1:
    Properties:
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnVisible: |-
        =Set(varFieldWidth, 300);
        Set(varFieldHeight, 30);
        Set(varMaterialHeight, 30);
        Set(varRightOffset, 30);
        Set(varBorderColor, RGBA(200, 200, 200, 1));
        Set(varBorderColorFocused, RGBA(0, 120, 212, 1));
        Set(varLabelLeftOffset, 20);
        Set(varContainerWidth, 85%);
        Set(varCopyMode, false);
        Set(varPrev, Blank());
        Set(varCopyCustomer, false);
        Set(varCopyPT, false);

        Set(fontColour, RGBA(0, 0, 0, 1));
        Set(fontSizeLabel, 15);

        Set(
            varMarginOverride,
            If(
                EditForm1.Mode = FormMode.New,
                Blank(),
                varSEABASSelectedTrade.'Marketing Margin'
            )
        );
        Set(varMarginManual, !IsBlank(varMarginOverride));

        UpdateContext({ varShowMarginDetails: false })
    Children:
      - RectQuickActionBar3:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            BorderStyle: =BorderStyle.None
            Fill: =RGBA(56, 96, 178, 1)
            Height: =88
            Width: =Parent.Width
            Y: =Container6.Height - 1
      - IconCancel1:
          Control: Classic/Icon@2.5.0
          Properties:
            AccessibleLabel: =Self.Tooltip
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(255, 255, 255, 1)
            Height: =88
            Icon: =Icon.Cancel
            OnSelect: |-
              =ResetForm(EditForm1);
              Back(ScreenTransition.Fade)
            PaddingBottom: =22
            PaddingLeft: =22
            PaddingRight: =22
            PaddingTop: =22
            PressedFill: =RGBA(255, 255, 255, 0.3)
            TabIndex: =0
            Tooltip: ="Cancel item"
            Width: =88
            Y: =Container6.Height
      - IconAccept1:
          Control: Classic/Icon@2.5.0
          Properties:
            AccessibleLabel: =Self.Tooltip
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(255, 255, 255, 1)
            Height: =88
            Icon: =Icon.Check
            OnSelect: |-
              =If(
                  !IsMatch(
                      Trim(MarketingMargin.Text),
                      "-?[0-9]+(\.[0-9]+)?",
                      MatchOptions.Complete
                  ),
                  Notify(
                      "Please enter a valid numerical value for Marketing Margin.",
                      NotificationType.Error
                  ),
                  SubmitForm(EditForm1)
              )
            PaddingBottom: =22
            PaddingLeft: =22
            PaddingRight: =22
            PaddingTop: =22
            PressedFill: =RGBA(255, 255, 255, 0.3)
            TabIndex: =0
            Tooltip: ="Submit item"
            Width: =88
            X: =Parent.Width - Self.Width
            Y: =Container6.Height
      - LblAppName3:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 0, 0, 1)
            Color: =RGBA(255, 255, 255, 1)
            Fill: =RGBA(58, 58, 58, 0)
            Font: =Font.'Open Sans'
            Height: =88
            Size: =27
            Text: |-
              =Concatenate("SEABAS - ", Switch(
                  EditForm1.Mode,
                  FormMode.New, "New",
                  FormMode.Edit, "Edit",
                  FormMode.View, "View"
              ), " Entry"
              )
            Width: =Parent.Width - IconCancel1.Width - IconAccept1.Width
            Wrap: =false
            X: =IconCancel1.X + IconCancel1.Width
            Y: =Container6.Height
      - EditForm1:
          Control: Form@2.4.4
          Variant: Classic
          Layout: Vertical
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            DataSource: ='SEABAS List'
            DefaultMode: =FormMode.New
            Height: =Parent.Height - EditForm1.Y
            Item: |-
              =If(
                  EditForm1.Mode = FormMode.New,
                  Defaults('SEABAS List'),
                  varSEABASSelectedTrade
              )
            OnSuccess: |-
              =If(
                  Self.LastSubmit.ID = varSEABASSelectedTrade.ID,
                  Set(varSEABASSelectedTrade, Self.LastSubmit)
              );
              Back();
              Set(varCopyMode, false);
              Set(varPrev, Blank());
              ResetForm(EditForm1);
