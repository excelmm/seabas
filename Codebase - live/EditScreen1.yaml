                        OnSelect: |-
                          =With(
                              {
                                  calculatedMargin: IfError(
                                      With(
                                          {
                                              selectedDate: TradeDate.SelectedDate,
                                              selectedProduct: Trim(ProductName.Selected.Value),
                                              selectedForm: Trim(Last(Split(ProductForm.Selected.Value, "-")).Value),
                                              selectedPackaging: Trim(Last(Split(Packaging.Selected.Value, "-")).Value),
                                              rawUnit: Trim(Last(Split(PackagingSize.Selected.Value, "-")).Value),
                                              selectedStuffingCode: Trim(First(Split(Stuffing.Selected.Value, "-")).Value)
                                          },
                                          With(
                                              {
                                                  selectedUnit: If(
                                                      EndsWith(Upper(rawUnit), "KGS"), Trim(Left(rawUnit, Len(rawUnit) - 3)),
                                                      EndsWith(Upper(rawUnit), "KG"), Trim(Left(rawUnit, Len(rawUnit) - 2)),
                                                      rawUnit
                                                  ),
                                                  selectedProductType: LookUp(
                                                      'SEABAS - Product Names' As product,
                                                      product.'Product Name' = selectedProduct,
                                                      product.'Product Type'.Value
                                                  ),
                                                  priceLookupForm: If(
                                                      Upper(selectedForm) = "BEAD" || Upper(selectedForm) = "FLAKE",
                                                      "Liquid",
                                                      selectedForm
                                                  ),
                                                  handlingCost: If(
                                                      Upper(selectedForm) = "BEAD" || Upper(selectedForm) = "FLAKE",
                                                      30,
                                                      0
                                                  )
                                              },
                                              If(
                                                  IsBlank(selectedDate) || IsBlank(selectedProduct) ||
                                                  IsBlank(selectedForm) || IsBlank(Price.Text),
                                                  Blank(),
                                                  With(
                                                      {
                                                          basePrice: First(
                                                              SortByColumns(
                                                                  Filter(
                                                                      'SEABAS - Reference Prices' As reference,
                                                                      reference.ProductName = selectedProduct &&
                                                                      reference.ProductType = priceLookupForm &&
                                                                      reference.TradeDate <= selectedDate &&
                                                                      reference.TradeDate >= DateAdd(selectedDate, -7, TimeUnit.Days)
                                                                  ),
                                                                  "TradeDate",
                                                                  SortOrder.Descending
                                                              )
                                                          ).SpotPrice,
                                                          packagingCost: If(
                                                              !IsBlank(selectedPackaging) && !IsBlank(selectedUnit) &&
                                                              !IsBlank(selectedProductType),
                                                              LookUp(
                                                                  'SEABAS - Packaging Pricing' As pack,
                                                                  pack.ProductType.Value = selectedProductType &&
                                                                  pack.Packaging = selectedPackaging &&
                                                                  Text(pack.'Unit (KG)') = selectedUnit,
                                                                  pack.'Cost (USD/MT)'
                                                              ),
                                                              Blank()
                                                          ),
                                                          stuffingCost: If(
                                                              !IsBlank(selectedStuffingCode),
                                                              LookUp(
                                                                  'SEABAS - Stuffing Pricing' As stuff,
                                                                  stuff.PackagingCode = selectedStuffingCode,
                                                                  stuff.'Cost (USD/MT)'
                                                              ),
                                                              Blank()
                                                          ),
                                                          brokerageFee: Coalesce(Value(BrokerageFee.Text), 0),
                                                          insuranceCost: Coalesce(Value(Insurance.Text), 0)
                                                      },
                                                      If(
                                                          IsBlank(basePrice),
                                                          Blank(),
                                                          Value(Price.Text) - basePrice - handlingCost -
                                                          Coalesce(packagingCost, 0) - Coalesce(stuffingCost, 0) -
                                                          brokerageFee - insuranceCost
                                                      )
                                                  )
                                              )
                                          )
                                      ),
                                      Blank()
                                  )
                              },
                              If(
                                  IsBlank(calculatedMargin),
                                  Notify(
                                      "Unable to calculate Marketing Margin. Check the trade details and reference prices.",
                                      NotificationType.Warning
                                  ),
                                  Set(varMarginOverride, calculatedMargin);
                                  Set(varMarginManual, false);
                                  Reset(MarketingMargin)
                              )
