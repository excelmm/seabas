Screens:
  BrowseScreen1:
    Properties:
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnVisible: |-
        =Refresh([@'SEABAS List']);
        Set(varCardsOffset, 10);
    Children:
      - RectQuickActionBar1:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Fill: =RGBA(56, 96, 178, 1)
            Height: =88
            Width: =Parent.Width
            Y: =Container5.Height - 1
      - LblAppName1:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 0, 0, 1)
            Color: =RGBA(255, 255, 255, 1)
            Fill: =RGBA(58, 58, 58, 0)
            Font: =Font.'Open Sans'
            Height: =88
            Size: =27
            Text: ="SEABAS"
            Width: =267
            Wrap: =false
            X: =109
            Y: =Container5.Height
      - IconRefresh1:
          Control: Classic/Icon@2.5.0
          Properties:
            AccessibleLabel: =Self.Tooltip
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(255, 255, 255, 1)
            DisplayMode: =If(Coalesce(varSEABASSearching, false), DisplayMode.Disabled, DisplayMode.Edit)
            Height: =88
            Icon: =Icon.Reload
            OnSelect: |-
              =If(
                  IsBlank(varSEABASAppliedQuery),
                  Refresh([@'SEABAS List']),
                  UpdateContext({locSEABASRefreshQuery: varSEABASAppliedQuery});
                  Select(SearchIcon1)
              )
            PaddingBottom: =22
            PaddingLeft: =22
            PaddingRight: =22
            PaddingTop: =22
            PressedFill: =RGBA(255, 255, 255, 0.3)
            TabIndex: =0
            Tooltip: ="Refresh list"
            Width: =88
            X: =Parent.Width - IconNewItem1.Width - IconSortUpDown1.Width - Self.Width
            Y: =Container5.Height
      - IconSortUpDown1:
          Control: Classic/Icon@2.5.0
          Properties:
            AccessibleLabel: =Self.Tooltip
            AutoDisableOnSelect: =false
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(255, 255, 255, 1)
            Height: =88
            Icon: =Icon.Sort
            OnSelect: |-
              =UpdateContext({SortDescending1: !SortDescending1})
            PaddingBottom: =26
            PaddingLeft: =26
            PaddingRight: =26
            PaddingTop: =26
            PressedFill: =RGBA(255, 255, 255, 0.3)
            TabIndex: =0
            Tooltip: =If(SortDescending1, "Sort list in reverse alphabetical order", "Sort list in alphabetical order")
            Width: =88
            X: =Parent.Width - IconNewItem1.Width - Self.Width
            Y: =Container5.Height
      - IconNewItem1:
          Control: Classic/Icon@2.5.0
          Properties:
            AccessibleLabel: =Self.Tooltip
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(255, 255, 255, 1)
            DisplayMode: =If(DataSourceInfo([@'SEABAS List'], DataSourceInfo.CreatePermission), DisplayMode.Edit, DisplayMode.Disabled)
            Height: =88
            Icon: =Icon.Add
            OnSelect: |-
              =NewForm(EditForm1);
              Navigate(EditScreen1, ScreenTransition.Fade)
            PaddingBottom: =24
            PaddingLeft: =24
            PaddingRight: =24
            PaddingTop: =24
            PressedFill: =RGBA(255, 255, 255, 0.3)
            TabIndex: =0
            Tooltip: ="Create new item"
            Width: =88
            X: =Parent.Width - Self.Width
            Y: =Container5.Height
      - TextSearchBox1:
          Control: Classic/TextInput@2.3.2
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            BorderStyle: =BorderStyle.None
            Default: =""
            DelayOutput: =false
            Font: =Font.'Open Sans'
            Height: =68
            HintText: ="Search items"
            HoverBorderColor: =RGBA(0, 18, 107, 1)
            HoverFill: =RGBA(186, 202, 226, 1)
            PaddingLeft: =70
            PaddingRight: =If(BtnCancelSearch.Visible, BtnCancelSearch.Width + 16, 8)
            RadiusBottomLeft: =0
            RadiusBottomRight: =7
            RadiusTopLeft: =0
            RadiusTopRight: =7
            Width: =Parent.Width
            Y: =RectQuickActionBar1.Height + RectQuickActionBar1.Y
      - SearchIcon1:
          Control: Classic/Icon@2.5.0
          Properties:
            AccessibleLabel: =Self.Tooltip
            AutoDisableOnSelect: =false
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(191, 190, 190, 1)
            DisplayMode: =If(Coalesce(varSEABASSearching, false), DisplayMode.Disabled, DisplayMode.Edit)
            Height: =Self.Width
            Icon: =Icon.Search
            OnSelect: |-
              =With(
                  {searchText: Coalesce(locSEABASRefreshQuery, TrimEnds(TextSearchBox1.Text))},
                  UpdateContext({locSEABASRefreshQuery: Blank()});
                  If(
                      !Coalesce(varSEABASSearching, false),
                      If(
                          IsBlank(searchText),
                          Set(varSEABASAppliedQuery, Blank());
                          Set(varSEABASSearchStatus, Blank());
                          Clear(colSEABASSearchResults);
                          Refresh([@'SEABAS List']);
                          true,
                          With(
                              {requestID: GUID()},
                              Set(varSEABASSearchRequest, requestID);
                              Set(varSEABASSearching, true);
                              Set(varSEABASSearchStatus, "Searching…");

                              IfError(
                                  With(
                                      {result: 'SEABAS-SearchTest'.Run(searchText)},
                                      If(
                                          varSEABASSearchRequest = requestID,
                                          With(
                                              {
                                                  rows: ForAll(
                                                      Table(ParseJSON(result.rowsjson)) As trade,
                                                      {
                                                          ID: Value(trade.Value.id),
                                                          Created: DateTimeValue(trade.Value.created),
                                                          'Trade Date': If(
                                                              IsBlank(Text(trade.Value.tradeDate)),
                                                              Blank(),
                                                              DateValue(trade.Value.tradeDate)
                                                          ),
                                                          'Sales Manager Name': {Value: Text(trade.Value.salesManager)},
                                                          'Product Name': {Value: Text(trade.Value.product)},
                                                          'Product Form': {Value: Text(trade.Value.productForm)},
                                                          'Volume (MT)': Value(trade.Value.volume),
                                                          Price: Value(trade.Value.price),
                                                          Incoterm: {Value: Text(trade.Value.incoterm)},
                                                          'Ship-to Destination': {Value: Text(trade.Value.destination)},
                                                          Customer: {Value: Text(trade.Value.customer)},
                                                          Remarks: Text(trade.Value.remarks),
                                                          'SAP SE Number': Text(trade.Value.sapSe)
                                                      }
                                                  )
                                              },
                                              If(
                                                  IsError(rows),
                                                  Error({Kind: ErrorKind.Validation, Message: "Invalid search results."}),
                                                  ClearCollect(colSEABASSearchResults, rows);
                                                  Set(varSEABASAppliedQuery, searchText);
                                                  Set(
                                                      varSEABASSearchStatus,
                                                      Coalesce(result.summary, If(IsEmpty(rows), "No matching trades.", "Search complete."))
                                                  );
                                                  Set(varSEABASSearching, false);
                                                  true
                                              )
                                          ),
                                          false
                                      )
                                  ),
                                  If(
                                      varSEABASSearchRequest = requestID,
                                      Set(varSEABASSearchStatus, "Search failed. Please try again.");
                                      Set(varSEABASSearching, false)
                                  );
                                  false
                              )
                          )
                      )
                  )
              )
            PaddingBottom: =14
            PaddingLeft: =14
            PaddingRight: =14
            PaddingTop: =14
            TabIndex: =0
            Tooltip: ="Search"
            Width: =TextSearchBox1.Height
            X: =TextSearchBox1.X
            Y: =TextSearchBox1.Y
      - BrowseGallery1:
          Control: Gallery@2.15.0
          Variant: BrowseLayout_Vertical_ThreeTextVariant_ver5.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Height: =Parent.Height - Self.Y
            Items: =SortByColumns([@'SEABAS List'], "Created", If(SortDescending1, SortOrder.Ascending, SortOrder.Descending))
            OnSelect: |-
              =Set(varSEABASSelectedTrade, ThisItem);
              Navigate(DetailScreen1, ScreenTransition.Fade)
            ShowScrollbar: =false
            TemplateSize: =130
            Visible: =IsBlank(varSEABASAppliedQuery)
            Width: =Parent.Width
            Y: =LblSEABASSearchStatus.Y + LblSEABASSearchStatus.Height
          Children:
            - Container3:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  Fill: =RGBA(228, 232, 240, 1)
                  Height: =Parent.TemplateHeight - varCardsOffset
                  RadiusBottomLeft: =10
                  RadiusBottomRight: =10
                  RadiusTopLeft: =10
                  RadiusTopRight: =10
                  Width: =Parent.TemplateWidth - varCardsOffset * 2
                  X: =varCardsOffset
                  Y: =varCardsOffset
            - Title1:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 1)
                  Color: =RGBA(0, 18, 107, 1)
                  Font: =Font.'Open Sans'
                  FontWeight: =If(ThisItem.IsSelected, FontWeight.Bold, FontWeight.Semibold)
                  Height: =Self.Size * 1.8
                  OnSelect: =Select(Parent)
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =16
                  Text: |-
                    =ThisItem.'Sales Manager Name'.Value&" (#"&ThisItem.ID&If(!IsBlank(ThisItem.'SAP SE Number')," | SAP SE #"&ThisItem.'SAP SE Number',"")&")"
                  VerticalAlign: =VerticalAlign.Top
                  Width: =Parent.TemplateWidth - 86
                  X: =30
                  Y: =(Parent.TemplateHeight - (Self.Size*3 + Subtitle1.Size*1.5 + 2 + Body1.Size*1.5)) / 2
            - Subtitle1:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 1)
                  Font: =Font.'Open Sans'
                  FontWeight: =If(ThisItem.IsSelected, FontWeight.Semibold, FontWeight.Normal)
                  Height: =Self.Size * 3.6
                  OnSelect: =Select(Parent)
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =12
                  Text: |-
                    =ThisItem.'Product Name'.Value&", "&ThisItem.'Volume (MT)'&" MT, "&ThisItem.'Product Form'.Value&", $"&ThisItem.Price&"/MT "&ThisItem.Incoterm.Value&" "&ThisItem.'Ship-to Destination'.Value&", "&ThisItem.Customer.Value&
                    If(!IsBlank(ThisItem.Remarks)," ("&ThisItem.Remarks&")")
                  VerticalAlign: =VerticalAlign.Top
                  Width: =Title1.Width
                  X: =Title1.X
                  Y: =Title1.Y + Title1.Height
            - Body1:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 1)
                  Color: =RGBA(50, 86, 160, 1)
                  Font: =Font.'Open Sans'
                  FontWeight: =If(ThisItem.IsSelected, FontWeight.Semibold, FontWeight.Normal)
                  Height: =Self.Size * 1.8
                  OnSelect: =Select(Parent)
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =12
                  Text: =Text(ThisItem.'Trade Date',"dd-mmm-yy")
                  VerticalAlign: =VerticalAlign.Top
                  Width: =Title1.Width
                  X: =Title1.X
                  Y: =Subtitle1.Y + Subtitle1.Height
            - NextArrow1:
                Control: Classic/Icon@2.5.0
                Properties:
                  AccessibleLabel: =Self.Tooltip
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Color: =RGBA(166, 166, 166, 1)
                  Height: =50
                  Icon: =Icon.ChevronRight
                  OnSelect: =Select(Parent)
                  PaddingBottom: =16
                  PaddingLeft: =16
                  PaddingRight: =16
                  PaddingTop: =16
                  Tooltip: ="View item details"
                  Width: =50
                  X: =Parent.TemplateWidth - Self.Width - 12
                  Y: =(Parent.TemplateHeight / 2) - (Self.Height / 2)
            - Separator1:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Fill: =RGBA(215, 223, 240, 1)
                  Height: =0
                  OnSelect: =Select(Parent)
                  Width: =Parent.TemplateWidth
                  Y: =Parent.TemplateHeight - Self.Height
            - Rectangle1:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Fill: =RGBA(0, 18, 107, 1)
                  Height: =Parent.TemplateHeight - Separator1.Height
                  OnSelect: =Select(Parent)
                  Visible: =ThisItem.IsSelected && false
                  Width: =4
      - SearchResultsGallery:
          Control: Gallery@2.15.0
          Variant: BrowseLayout_Vertical_ThreeTextVariant_ver5.0
          Properties:
            BorderColor: =BrowseGallery1.BorderColor
            Height: =BrowseGallery1.Height
            Items: =Sort(colSEABASSearchResults, Created, If(SortDescending1, SortOrder.Ascending, SortOrder.Descending))
            OnSelect: |-
              =With(
                  {selectedTradeID: ThisItem.ID},
                  Set(
                      varSEABASSelectedTrade,
                      IfError(LookUp([@'SEABAS List'], ID = selectedTradeID), Blank())
                  );
                  If(
                      IsBlank(varSEABASSelectedTrade),
                      Notify("This trade could not be opened. Refresh and try again.", NotificationType.Warning),
                      Navigate(DetailScreen1, ScreenTransition.Fade)
                  )
              )
            ShowScrollbar: =BrowseGallery1.ShowScrollbar
            TemplateSize: =BrowseGallery1.TemplateSize
            Visible: =!IsBlank(varSEABASAppliedQuery)
            Width: =BrowseGallery1.Width
            Y: =BrowseGallery1.Y
          Children:
            - SearchResultCard:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  Fill: =RGBA(228, 232, 240, 1)
                  Height: =Parent.TemplateHeight - varCardsOffset
                  RadiusBottomLeft: =10
                  RadiusBottomRight: =10
                  RadiusTopLeft: =10
                  RadiusTopRight: =10
                  Width: =Parent.TemplateWidth - varCardsOffset * 2
                  X: =varCardsOffset
                  Y: =varCardsOffset
            - SearchResultTitle:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 1)
                  Color: =RGBA(0, 18, 107, 1)
                  Font: =Font.'Open Sans'
                  FontWeight: =If(ThisItem.IsSelected, FontWeight.Bold, FontWeight.Semibold)
                  Height: =Self.Size * 1.8
                  OnSelect: =Select(Parent)
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =16
                  Text: |-
                    =ThisItem.'Sales Manager Name'.Value&" (#"&ThisItem.ID&If(!IsBlank(ThisItem.'SAP SE Number')," | SAP SE #"&ThisItem.'SAP SE Number',"")&")"
                  VerticalAlign: =VerticalAlign.Top
                  Width: =Parent.TemplateWidth - 86
                  X: =30
                  Y: =(Parent.TemplateHeight - (Self.Size*3 + SearchResultSubtitle.Size*1.5 + 2 + SearchResultDate.Size*1.5)) / 2
            - SearchResultSubtitle:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 1)
                  Font: =Font.'Open Sans'
                  FontWeight: =If(ThisItem.IsSelected, FontWeight.Semibold, FontWeight.Normal)
                  Height: =Self.Size * 3.6
                  OnSelect: =Select(Parent)
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =12
                  Text: |-
                    =ThisItem.'Product Name'.Value&", "&ThisItem.'Volume (MT)'&" MT, "&ThisItem.'Product Form'.Value&", $"&ThisItem.Price&"/MT "&ThisItem.Incoterm.Value&" "&ThisItem.'Ship-to Destination'.Value&", "&ThisItem.Customer.Value&
                    If(!IsBlank(ThisItem.Remarks)," ("&ThisItem.Remarks&")")
                  VerticalAlign: =VerticalAlign.Top
                  Width: =SearchResultTitle.Width
                  X: =SearchResultTitle.X
                  Y: =SearchResultTitle.Y + SearchResultTitle.Height
            - SearchResultDate:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 1)
                  Color: =RGBA(50, 86, 160, 1)
                  Font: =Font.'Open Sans'
                  FontWeight: =If(ThisItem.IsSelected, FontWeight.Semibold, FontWeight.Normal)
                  Height: =Self.Size * 1.8
                  OnSelect: =Select(Parent)
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =12
                  Text: =Text(ThisItem.'Trade Date',"dd-mmm-yy")
                  VerticalAlign: =VerticalAlign.Top
                  Width: =SearchResultTitle.Width
                  X: =SearchResultTitle.X
                  Y: =SearchResultSubtitle.Y + SearchResultSubtitle.Height
            - SearchResultArrow:
                Control: Classic/Icon@2.5.0
                Properties:
                  AccessibleLabel: =Self.Tooltip
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Color: =RGBA(166, 166, 166, 1)
                  Height: =50
                  Icon: =Icon.ChevronRight
                  OnSelect: =Select(Parent)
                  PaddingBottom: =16
                  PaddingLeft: =16
                  PaddingRight: =16
                  PaddingTop: =16
                  Tooltip: ="View item details"
                  Width: =50
                  X: =Parent.TemplateWidth - Self.Width - 12
                  Y: =(Parent.TemplateHeight / 2) - (Self.Height / 2)
      - Rectangle11:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Fill: =RGBA(0, 18, 107, 1)
            Height: =2
            Width: =Parent.Width
            Y: =TextSearchBox1.Y + TextSearchBox1.Height
      - IconBack1:
          Control: Classic/Icon@2.5.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(255, 255, 255, 1)
            Height: =57
            Icon: =Icon.BackArrow
            OnSelect: =Navigate(IntroScreen,ScreenTransition.Fade)
            Width: =53
            X: =23
            Y: =Container5.Height + 15
      - Container5:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            BorderStyle: =BorderStyle.None
            DropShadow: =DropShadow.None
            Fill: =RGBA(56, 96, 178, 1)
            Height: =50
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =640
      - LblSEABASSearchStatus:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Font: =Font.'Open Sans'
            Height: =28
            Size: =14
            Text: =Coalesce(varSEABASSearchStatus, "Enter a search and select the magnifying glass.")
            Width: =Parent.Width
            Y: =TextSearchBox1.Y + TextSearchBox1.Height
      - BtnCancelSearch:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorFade(Self.Fill, -15%)
            Color: =RGBA(39, 67, 125, 1)
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            Fill: =RGBA(215, 223, 240, 1)
            Font: =Font.'Open Sans'
            Height: =40
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
            OnSelect: |-
              =Set(varSEABASSearchRequest, Blank());
              Set(varSEABASSearching, false);
              Set(varSEABASSearchStatus, "Search cancelled.")
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            Size: =18
            Text: ="Cancel"
            Visible: =Coalesce(varSEABASSearching, false)
            Width: =88
            X: =TextSearchBox1.X + TextSearchBox1.Width - Self.Width - 8
            Y: =TextSearchBox1.Y + (TextSearchBox1.Height - Self.Height) / 2
