Screens:
  DetailScreen1:
    Properties:
      Fill: =
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnVisible: |-
        =Set(varFieldWidth, App.Width - 320);
        Set(varLabelWidth, App.Width - varFieldWidth - 80);
        Set(varFieldHeight, 40);
        Set(varRightOffset, 40);
        Set(varTopOffset, 0);
        Set(fontSizeLabel, 16);
    Children:
      - RectQuickActionBar2:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Fill: =RGBA(56, 96, 178, 1)
            Height: =88
            Width: =Parent.Width
            Y: =Container7.Height-1
      - IconBackarrow1:
          Control: Classic/Icon@2.5.0
          Properties:
            AccessibleLabel: =Self.Tooltip
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(255, 255, 255, 1)
            Height: =88
            Icon: =Icon.ChevronLeft
            OnSelect: =Navigate(BrowseScreen1, ScreenTransition.Fade)
            PaddingBottom: =24
            PaddingLeft: =24
            PaddingRight: =24
            PaddingTop: =24
            PressedFill: =RGBA(255, 255, 255, 0.3)
            TabIndex: =0
            Tooltip: ="Back to list"
            Width: =88
            Y: =Container7.Height
      - IconEdit1:
          Control: Classic/Icon@2.5.0
          Properties:
            AccessibleLabel: =Self.Tooltip
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(255, 255, 255, 1)
            Height: =88
            Icon: =Icon.Edit
            OnSelect: =EditForm(EditForm1);Navigate(EditScreen1, ScreenTransition.None)
            PaddingBottom: =24
            PaddingLeft: =24
            PaddingRight: =24
            PaddingTop: =24
            PressedFill: =RGBA(255, 255, 255, 0.3)
            TabIndex: =0
            Tooltip: ="Edit this item"
            Visible: =varSEABASSelectedTrade.'Created By'.Email = User().Email
            Width: =88
            X: =Parent.Width - Self.Width
            Y: =RectQuickActionBar2.Y
      - IconDelete1:
          Control: Classic/Icon@2.5.0
          Properties:
            AccessibleLabel: =Self.Tooltip
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(255, 255, 255, 1)
            DisplayMode: |-
              =If(
                  varSEABASSelectedTrade.'Created By'.Email = User().Email,
                  DisplayMode.Edit,
                  DisplayMode.Disabled
              )
            Height: =88
            Icon: =Icon.Trash
            OnSelect: |-
              =UpdateContext({ showDeleteConfirm: true })
            PaddingBottom: =24
            PaddingLeft: =24
            PaddingRight: =24
            PaddingTop: =24
            PressedFill: =RGBA(255, 255, 255, 0.3)
            TabIndex: =0
            Tooltip: ="Delete this item"
            Visible: =false
            Width: =88
            X: =Parent.Width - IconEdit1.Width - Self.Width
            Y: =RectQuickActionBar2.Y
      - LblAppName2:
          Control: Label@2.5.1
